apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaselogs
  labels:
    app.kubernetes.io/name: releaselogs
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: releaselogs
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: releaselogs
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: releaselogs
          image: releaselogs:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_DATA_DIR
              value: /app/data
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            - name: DOWNLOAD_TEMP_DIR
              value: /tmp/releaselogs-downloads
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: https
              containerPort: 3443
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: download-cache
              mountPath: /tmp/releaselogs-downloads
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: download-cache
          emptyDir: {}
        - name: config
          configMap:
            name: releaselogs-config
            items:
              - key: config.yaml
                path: config.yaml
